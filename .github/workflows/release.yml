name: Build & Release Multi-Platform

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish GitHub Release'
        required: true
        type: boolean
        default: true
      release_tag:
        description: 'Release Tag (leave empty for auto tag e.g. v1.0.2)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------
  # ANDROID BUILD
  # -------------------------------------------------------------
  build-android:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Package Android Artifact
        run: cp build/app/outputs/flutter-apk/app-release.apk Subtitle-Generator-Android.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: subtitle-generator-android-apk
          path: Subtitle-Generator-Android.apk
          retention-days: 7

  # -------------------------------------------------------------
  # LINUX BUILD
  # -------------------------------------------------------------
  build-linux:
    name: 🐧 Build Linux Desktop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            libsecret-1-dev \
            libjsoncpp-dev \
            libjson-glib-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux Desktop Bundle
        run: flutter build linux --release

      - name: Compress Linux Bundle
        run: tar -czvf Subtitle-Generator-Linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: subtitle-generator-linux-x64
          path: Subtitle-Generator-Linux-x64.tar.gz
          retention-days: 7

  # -------------------------------------------------------------
  # WINDOWS BUILD
  # -------------------------------------------------------------
  build-windows:
    name: 🪟 Build Windows Desktop
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Desktop
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: flutter build windows --release

      - name: Compress Windows Bundle
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath Subtitle-Generator-Windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: subtitle-generator-windows-x64
          path: Subtitle-Generator-Windows-x64.zip
          retention-days: 7

  # -------------------------------------------------------------
  # MACOS & IOS BUILD
  # -------------------------------------------------------------
  build-macos-ios:
    name: 🍎 Build macOS / iOS Bundle
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS Release
        run: flutter build macos --release

      - name: Compress macOS Bundle
        run: |
          cd build/macos/Build/Products/Release
          zip -r ../../../../../Subtitle-Generator-macOS-Universal.zip *.app
          cd ../../../../..

      - name: Build iOS Release Without Codesign
        run: flutter build ios --release --no-codesign

      - name: Package Unsigned iOS IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r Subtitle-Generator-iOS-unsigned.ipa Payload

      - name: Upload macOS & iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: subtitle-generator-apple-bundle
          path: |
            Subtitle-Generator-macOS-Universal.zip
            Subtitle-Generator-iOS-unsigned.ipa
          retention-days: 7

  # -------------------------------------------------------------
  # CONSOLIDATED PUBLISH RELEASE
  # -------------------------------------------------------------
  publish-release:
    name: 🚀 Publish Multi-Platform Release
    needs: [build-android, build-linux, build-windows, build-macos-ios]
    if: always() && (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)) && (needs.build-android.result == 'success' || needs.build-linux.result == 'success' || needs.build-windows.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Release Tag
        id: release_info
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          else
            VERSION=$(grep '^version:' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Release tag: ${TAG}"

      - name: Download all workflow artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Flatten Artifacts for Release
        run: |
          mkdir -p final-release
          find release-artifacts/ -type f -exec cp {} final-release/ \;
          ls -la final-release/

      - name: Create or Update Multi-Platform GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: Subtitle Generator ${{ steps.release_info.outputs.tag }} 🎬
          files: final-release/*
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            # 🎬 Subtitle Generator ${{ steps.release_info.outputs.tag }} — Multi-Platform Release

            Cross-Platform Edge-Cloud Hybrid AI Subtitle & Closed-Caption Engine.

            ### 📦 Download Packages
            * **📱 Android (APK):** `Subtitle-Generator-Android.apk`
            * **🐧 Linux (x64 Portable):** `Subtitle-Generator-Linux-x64.tar.gz`
            * **🪟 Windows (x64):** `Subtitle-Generator-Windows-x64.zip`
            * **🍎 macOS (Universal):** `Subtitle-Generator-macOS-Universal.zip`
            * **📱 iOS (Unsigned IPA):** `Subtitle-Generator-iOS-unsigned.ipa`
