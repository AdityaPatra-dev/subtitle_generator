name: subtitle_generator
description: "Cross-platform AI Subtitle Generator with Smart Edge-Cloud Hybrid Architecture."
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Local Database & Storage
  drift: ^2.18.0
  sqlite3: ^2.4.5
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Hardware-Backed Secure Storage
  flutter_secure_storage: ^9.0.0

  # Native Media Processing (Android, iOS, macOS)
  ffmpeg_kit_flutter_new: ^4.6.7

  # Networking & HTTP
  dio: ^5.4.3+1
  http_parser: ^4.0.2

  # Media & File Picking
  file_picker: ^8.0.3


  # Utilities
  uuid: ^4.4.0
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.3
  open_filex: ^5.0.0
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.9
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/icons/app_icon.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/icons/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icons/app_icon.png
