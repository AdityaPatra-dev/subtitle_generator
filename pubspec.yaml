name: subtitle_generator
description: "Cross-platform AI Subtitle Generator with Smart Edge-Cloud Hybrid Architecture."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Local Database & Storage
  drift: ^2.18.0
  sqlite3: ^2.4.5
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Hardware-Backed Secure Storage
  flutter_secure_storage: ^9.0.0

  # Networking & HTTP
  dio: ^5.4.3+1
  http_parser: ^4.0.2

  # Media & File Picking
  file_picker: ^8.0.3

  # Firebase Suite (Optional Cloud Sync & Auth)
  firebase_core: ^2.30.1
  firebase_auth: ^4.19.4
  cloud_firestore: ^4.17.2
  firebase_storage: ^11.7.4
  google_sign_in: ^6.2.1

  # Utilities
  uuid: ^4.4.0
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
